<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Sunil Sharma</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #161b22;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            width: 100%;
            max-width: 420px;
            border: 1px solid #30363d;
            box-shadow: 0 10px 35px rgba(0,0,0,0.4);
        }

        .profile {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #00c4ff;
            color: #0d1117;
            font-size: 38px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #8b949e;
            margin-bottom: 30px;
        }

        .number {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .btn {
            display: block;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
            transition: 0.3s;
        }

        .call {
            background: #238636;
            color: white;
        }

        .call:hover {
            background: #2ea043;
        }

        .whatsapp {
            background: #25D366;
            color: white;
        }

        .whatsapp:hover {
            background: #1da851;
        }

        .footer {
            color: #8b949e;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="profile">SS</div>

        <h1>Sunil Sharma</h1>

        <p class="subtitle">
            Data Analyst | MIS Executive
        </p>

        <p class="number">
            📞 +91 6376309510
        </p>

        <a class="btn call" href="tel:+916376309510">
            📞 CALL NOW
        </a>

        <a class="btn whatsapp"
           href="https://wa.me/919352628954"
           target="_blank">
            💬 CHAT ON WHATSAPP
        </a>

        <p class="footer">
            © 2026 Sunil Sharma | All Rights Reserved
        </p>

    </div>

</body>
</html>
