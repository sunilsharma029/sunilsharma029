<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Sunil Sharma</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #161b22;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 1px solid #30363d;
        }

        .profile {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #00c4ff;
            color: #0d1117;
            font-size: 38px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #8b949e;
            margin-bottom: 30px;
        }

        .number {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .call {
            display: block;
            background: #238636;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .email {
            color: #00c4ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="profile">SS</div>

        <h1>Sunil Sharma</h1>

        <p class="subtitle">Data Analyst | MIS Executive</p>

        <p class="number">📞 +91 6376309510</p>

        <a class="call" href="tel:+916376309510">
            📞 CALL NOW
        </a>

        <a class="email" href="mailto:sunilsharma.work@outlook.com">
            ✉️ Email Me
        </a>

    </div>

</body>
</html>
